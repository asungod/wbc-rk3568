[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wbc-rk3568"
version = "0.1.0"
description = "RK3568 white blood cell detection, classification and sample upload"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23,<3", "opencv-python>=4.7,<5", "requests>=2.31,<3"]

[project.optional-dependencies]
gui = ["PySide6>=6.5,<7"]

[project.scripts]
wbc-edge = "wbc_edge.cli:main"
wbc-gui = "wbc_edge.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
